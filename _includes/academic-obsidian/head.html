<style>/* Figures and colour coding for the academic-obsidian blog post. Colours follow

/* the topic explorer (vault-graph), in px of the 1440×820 slide space */

.aob-x .vg-note { font-size: 15.1px; height: 30px; line-height: 30px; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.aob-x .vg-note.sub { color: #8a94a0; }

.aob-switcher { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(26, 26, 46, 0.12), 0 0 0 1px rgba(26, 26, 46, 0.06); overflow: hidden; text-align: left; }
.aob-sw-input { box-sizing: border-box; font-size: 18px; font-weight: 600; line-height: 1.5; padding: 14px 18px; border-bottom: 1px solid #eceef1; height: 56px; overflow: hidden; color: #1a1a2e; white-space: nowrap; }
.aob-caret { display: inline-block; width: 2px; height: 1.1em; background: #8064A2; vertical-align: -3px; margin-left: 2px; animation: aob-blink 1s steps(1) infinite; }
@keyframes aob-blink { 50% { opacity: 0; } }
/* fixed height: room for 5 results (render() shows at most 5), so the page below never moves */
.aob-sw-rows { height: 212px; padding: 6px 0; box-sizing: border-box; overflow: hidden; }
.aob-sw-row { display: flex; align-items: center; gap: 12px; height: 40px; box-sizing: border-box; padding: 0 18px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.aob-sw-row.on { background: #f1eef6; }

.aob-sw-row .n { overflow: hidden; text-overflow: ellipsis; }

.aob-sw-row mark { background: #fff1b8; color: inherit; padding: 0 1px; border-radius: 2px; }

<script>// The quick-switcher alias demo, shared by the slides (imported) and the blog
// (inlined into the post by build-blog-figures.mjs, without the `export`s).
// notes: [{ n: name, a: [aliases], c: colour, t: type }]
function swEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
// Fuzzy match as in Obsidian: the query's characters in order, close together;
// contiguous matches rank first, prefixes before infixes.
function swMatchOne(s, q) {
const sl = s.toLowerCase(), i = sl.indexOf(q);
if (i >= 0) return { score: i === 0 ? 0 : 1, at: [...Array(q.length).keys()].map(k => i + k) };
const at = [];
for (let j = 0, k = 0; j < sl.length && k < q.length; j++) if (sl[j] === q[k]) { at.push(j); k++; }
return at.length === q.length && at[at.length - 1] - at[0] < 2 * q.length ? { score: 2 + (at[at.length - 1] - at[0]) / 100, at } : null;
}
/** Up to `max` notes matching q by name or alias: [{ note, alias|null, at }]. */
function swMatch(notes, q, max = 5) {
const ql = q.toLowerCase(), hits = [];
if (!ql) return hits;
for (const n of notes) {
let best = null;
const m = swMatchOne(n.n, ql);
if (m) best = { ...m, alias: null };
for (const a of n.a) { const ma = swMatchOne(a, ql); if (ma && (!best || ma.score < best.score)) best = { ...ma, alias: a }; }
if (best) hits.push({ note: n, ...best });
}
hits.sort((x, y) => x.score - y.score || x.note.n.length - y.note.n.length);
return hits.slice(0, max);
}
/** HTML of s with the characters at positions `at` in <mark>. */
function swHighlight(s, at) {
return [...s].map((c, i) => (at.includes(i) ? (at.includes(i - 1) ? '' : '<mark>') + swEsc(c) + (at.includes(i + 1) ? '' : '</mark>') : swEsc(c))).join('');
}
/** Type the queries one by one, forever; show(q) is called after every keystroke. */
async function swRun(queries, { show, active = () => true, typeMs = 110, holdMs = 2200, deleteMs = 35, gapMs = 350 }) {
const sleep = ms => new Promise(r => setTimeout(r, ms));
for (let k = 0; ; k = (k + 1) % queries.length) {
const q = queries[k];
while (!active()) await sleep(250);
for (let i = 1; i <= q.length; i++) { show(q.slice(0, i)); await sleep(typeMs); }
await sleep(holdMs);
for (let i = q.length - 1; i >= 0; i--) { show(q.slice(0, i)); await sleep(deleteMs); }
await sleep(gapMs);
}
}
// Behaviour for the academic-obsidian blog figures: scale the banner to the
// column, hover cards for [data-tip], and the alias demo in the quick switcher.
(() => {
const ready = f => (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', f) : f());
ready(() => {
// banner
document.querySelectorAll('[data-aob-scale]').forEach(box => {
const canvas = box.firstElementChild, W = Number(box.dataset.aobScale);
const fit = () => { canvas.style.transform = `scale(${box.clientWidth / W})`; };
fit();
if (window.ResizeObserver) new ResizeObserver(fit).observe(box); else window.addEventListener('resize', fit);
});
// hover cards
const tip = document.createElement('div');
tip.className = 'aob-tip';
document.body.appendChild(tip);
document.querySelectorAll('.aob-fig').forEach(f => {
f.addEventListener('mousemove', e => {
const t = e.target.closest('[data-tip]');
if (!t) { tip.style.opacity = 0; return; }
tip.innerHTML = t.getAttribute('data-tip');
tip.style.left = e.clientX + 14 + 'px';
tip.style.top = e.clientY + 14 + 'px';
tip.style.opacity = 1;
});
f.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
});
// quick switcher: type an alias, see which note it finds (swMatch etc.: switcher.js)
document.querySelectorAll('[data-aob-switcher]').forEach(sw => {
const { notes, queries } = JSON.parse(sw.querySelector('.aob-sw-data').textContent);
const qEl = sw.querySelector('.aob-sw-q'), rows = sw.querySelector('.aob-sw-rows');
const show = q => {
qEl.textContent = q;
const hits = swMatch(notes, q);
rows.innerHTML = !q ? '' : hits.length
? hits.map((h, i) => `<div class="aob-sw-row ${i ? 'dim' : 'on'}"><span class="n" style="color:${h.note.c}">${h.alias ? swEsc(h.note.n) : swHighlight(h.note.n, h.at)}</span>${h.alias ? `<small>${swHighlight(h.alias, h.at)}</small>` : ''}</div>`).join('')
: '<div class="aob-sw-empty">No notes found.</div>';
};
show(queries[0]);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
let visible = false;
new IntersectionObserver(es => { visible = es.some(e => e.isIntersecting); }).observe(sw);
swRun(queries, { show, active: () => visible });
});
});
})();
</script>
